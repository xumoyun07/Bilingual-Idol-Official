# Конфигурация pnpm-воркспейса.
#
# Файл создан автоматически pnpm 11 при первой установке зависимостей
# (из-за политики supply-chain, см. minimumReleaseAge). Значение-заглушка
# «set this to true or false» заменено на корректное: esbuild — нативный
# бинарник, его postinstall-скрипт обязателен для сборки проекта.
#
# Если нужно запретить build-скрипты пакета, поставьте false.
allowBuilds:
  esbuild: true
